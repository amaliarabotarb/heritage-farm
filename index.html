<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN HERITAGE — Фермерское хозяйство и питомник собак</title>
    
    <!-- Favicon (Фавикон) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23730123'><path d='M12 2L2 12l10 10 10-10L12 2zm0 3.83L18.17 12 12 18.17 5.83 12 12 5.83z'/></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet CSS & JS (Чистая карта без блокировок и рекламы) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#1a1817',
                        brandRed: '#e61e38',
                        brandTelegram: '#0088cc',
                        brandCream: '#f7f4ef',
                        brandBurgundy: '#730123',
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .hero-bg {
            background: linear-gradient(180deg, rgba(20, 15, 10, 0.45) 0%, rgba(20, 15, 10, 0.65) 100%), 
                        url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2832&auto=format&fit=crop') center/cover no-repeat;
        }
    </style>
</head>
<body class="bg-brandCream text-brandDark font-sans antialiased selection:bg-brandBurgundy selection:text-white">

    <!-- ==================== БЛОК 1: ГЛАВНЫЙ ЭКРАН ==================== -->
    <section class="relative min-h-screen hero-bg flex flex-col justify-between text-white px-4 md:px-12 py-6 md:py-10">
        
        <!-- Шапка: Логотип и Кнопка YouTube -->
        <header class="flex justify-between items-start w-full max-w-7xl mx-auto">
            <!-- Название компании: В 2 строки, шрифт Serif -->
            <div class="leading-none">
                <a href="#" class="font-serif font-bold text-2xl md:text-4xl tracking-wider uppercase block drop-shadow-md hover:opacity-90 transition">
                    ASPEN<br>HERITAGE
                </a>
            </div>

            <!-- Кнопка YouTube (Красная) -->
            <a href="https://youtube.com/@aspen_heritage?si=hTkDpYstGlAHq1Dr" target="_blank" rel="noopener noreferrer" 
               class="bg-brandRed hover:bg-red-700 text-white font-medium text-xs md:text-sm px-4 py-2.5 rounded-full flex items-center gap-2 transition shadow-lg hover:scale-105">
                <i class="fa-brands fa-youtube text-base"></i>
                <span>YouTube</span>
            </a>
        </header>

        <!-- Центральный контент -->
        <main class="w-full max-w-7xl mx-auto my-auto py-12">
            <!-- Заголовок: Простой шрифт без засечек (Montserrat) -->
            <h1 class="font-sans font-light text-3xl sm:text-5xl md:text-6xl lg:text-7xl leading-tight max-w-4xl tracking-tight drop-shadow-lg mb-8">
                Фермерское хозяйство и питомник собак
            </h1>

            <!-- Овальные теги категорий -->
            <div class="flex flex-wrap gap-2 md:gap-3 text-xs md:text-sm">
                <span class="px-4 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md">Овцы</span>
                <span class="px-4 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md">Гуси</span>
                <span class="px-4 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md">Утки</span>
                <span class="px-4 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md">Куры</span>
                <span class="px-4 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md">Ягдтерьеры</span>
            </div>
        </main>

        <!-- Нижний блок: Телефон и Telegram -->
        <footer class="w-full max-w-7xl mx-auto flex flex-wrap items-center gap-4 pt-6">
            <!-- Кнопка телефона -->
            <a href="tel:+375296666621" class="bg-white/90 hover:bg-white text-brandDark px-5 py-2.5 rounded-2xl flex flex-col justify-center transition shadow-md hover:scale-105">
                <span class="text-[10px] uppercase tracking-wider text-gray-500 font-medium">Позвонить</span>
                <span class="font-semibold text-sm md:text-base">+375 29 666 66 21</span>
            </a>

            <!-- Кнопка Telegram (Голубая, ведет прямо на @aspenheritage) -->
            <a href="https://t.me/aspenheritage" target="_blank" rel="noopener noreferrer" 
               class="bg-brandTelegram hover:bg-sky-600 text-white px-5 py-3 rounded-2xl flex items-center gap-2.5 transition shadow-md hover:scale-105">
                <i class="fa-brands fa-telegram text-lg"></i>
                <span class="font-medium text-xs md:text-sm">Написать в Telegram</span>
            </a>
        </footer>
    </section>

    <!-- ==================== БЛОК 2: КАРТА И КОНТАКТЫ ==================== -->
    <section class="w-full bg-brandCream py-12 md:py-16 flex flex-col items-center">
        
        <!-- Заголовок секции: Тонкий шрифт без засечек (Montserrat) -->
        <div class="text-center mb-8 px-4">
            <h2 class="font-sans font-light text-2xl md:text-4xl text-brandDark tracking-wide">
                Как к нам проехать
            </h2>
        </div>

        <!-- Контейнер интерактивной карты -->
        <div id="map" class="w-full h-[450px] md:h-[550px] bg-gray-200 shadow-inner z-0"></div>

        <!-- Контакты под картой -->
        <div class="w-full max-w-4xl px-4 mt-8 flex flex-col items-center text-center">
            
            <!-- Почта -->
            <a href="mailto:mail@heritage.by" class="text-lg md:text-xl font-medium text-brandDark hover:text-brandBurgundy transition mb-6 inline-flex items-center gap-2">
                <i class="fa-regular fa-envelope text-brandBurgundy"></i>
                mail@heritage.by
            </a>

            <!-- Одинаковые кнопки навигации -->
            <div class="flex flex-wrap justify-center items-center gap-3 md:gap-4 mb-10 w-full max-w-sm">
                <a href="https://yandex.ru/maps?whatshere%5Bzoom%5D=18&whatshere%5Bpoint%5D=28.300111,54.303303&si=a0k00ax43cwfgry9wq2b63h124" 
                   target="_blank" rel="noopener noreferrer" 
                   class="flex-1 min-w-[140px] px-5 py-2.5 rounded-full border border-gray-400 text-brandDark text-xs md:text-sm font-medium hover:bg-brandDark hover:text-white transition shadow-sm inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-route text-red-700"></i>
                    Яндекс Карты
                </a>

                <a href="https://www.google.com/maps/search/?api=1&query=54.303303,28.300111" 
                   target="_blank" rel="noopener noreferrer" 
                   class="flex-1 min-w-[140px] px-5 py-2.5 rounded-full border border-gray-400 text-brandDark text-xs md:text-sm font-medium hover:bg-brandDark hover:text-white transition shadow-sm inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-location-dot text-blue-600"></i>
                    Google Maps
                </a>
            </div>

            <!-- Копирайт -->
            <footer class="border-t border-gray-300/60 w-full pt-6 text-center">
                <p class="text-xs text-brandDark/50 font-sans tracking-wider uppercase">
                    © ASPEN HERITAGE. Все права защищены.
                </p>
            </footer>
        </div>
    </section>

    <!-- Инициализация карты -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var lat = 54.303303;
            var lng = 28.300111;

            var map = L.map('map', {
                scrollWheelZoom: false
            }).setView([lat, lng], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            var customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color:#e61e38; width:22px; height:22px; border-radius:50%; border:3px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            L.marker([lat, lng], { icon: customIcon }).addTo(map)
                .bindPopup('<b>ASPEN HERITAGE</b><br>Фермерское хозяйство').openPopup();
        });
    </script>
</body>
</html>
